<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Neon Meteor Dash</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #03001a;
    font-family: 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
    color: #e8f9ff;
    user-select: none;
    cursor: crosshair;
  }
  canvas { display: block; position: absolute; top: 0; left: 0; }

  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 24px;
    background: radial-gradient(ellipse at center, rgba(20, 0, 50, 0.55) 0%, rgba(0,0,0,0.88) 75%);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    z-index: 10;
  }
  .overlay.hidden { display: none; }

  h1 {
    font-size: clamp(2.2rem, 6vw, 5.4rem);
    letter-spacing: 0.25em;
    color: #00f0ff;
    text-shadow:
      0 0 8px  #00f0ff,
      0 0 24px #00d0ff,
      0 0 60px #007aff,
      0 0 100px rgba(0, 122, 255, 0.4);
    margin-bottom: 22px;
    animation: titlePulse 3.2s ease-in-out infinite;
  }
  @keyframes titlePulse {
    0%, 100% { text-shadow: 0 0 8px #00f0ff, 0 0 24px #00d0ff, 0 0 60px #007aff; }
    50%      { text-shadow: 0 0 14px #ff2bd6, 0 0 32px #ff2bd6, 0 0 80px #ff2bd6; }
  }
  h2 {
    font-size: clamp(1.6rem, 4.5vw, 3.2rem);
    letter-spacing: 0.22em;
    color: #ff2bd6;
    text-shadow: 0 0 10px #ff2bd6, 0 0 32px #ff2bd6, 0 0 70px rgba(255,43,214,0.55);
    margin-bottom: 18px;
  }
  p {
    font-size: clamp(0.92rem, 1.5vw, 1.1rem);
    margin: 6px 0;
    opacity: 0.88;
    letter-spacing: 0.06em;
  }
  kbd {
    display: inline-block;
    padding: 2px 8px;
    margin: 0 2px;
    border: 1px solid #00f0ff;
    border-radius: 4px;
    background: rgba(0, 240, 255, 0.1);
    box-shadow: 0 0 8px rgba(0, 240, 255, 0.4) inset;
    color: #aef6ff;
    font-family: inherit;
    font-size: 0.9em;
  }

  button {
    margin-top: 28px;
    padding: 12px 38px;
    font-family: inherit;
    font-size: 1.15rem;
    font-weight: bold;
    letter-spacing: 0.3em;
    color: #03001a;
    background: linear-gradient(135deg, #00f0ff 0%, #5cffb0 100%);
    border: none;
    border-radius: 4px;
    cursor: pointer;
    box-shadow: 0 0 14px #00f0ff, 0 0 44px rgba(0, 240, 255, 0.6);
    transition: transform 0.12s ease, box-shadow 0.2s ease;
  }
  button:hover {
    transform: scale(1.06);
    box-shadow: 0 0 18px #5cffb0, 0 0 60px rgba(92, 255, 176, 0.85);
  }
  button:active { transform: scale(0.98); }

  .stat { margin: 4px 0; font-size: clamp(1rem, 1.8vw, 1.2rem); }
  .stat .val { color: #5cffb0; font-weight: bold; text-shadow: 0 0 10px #5cffb0; }
  .stat.high .val { color: #ff2bd6; text-shadow: 0 0 10px #ff2bd6; }

  .footnote {
    position: absolute;
    bottom: 14px;
    left: 0; right: 0;
    text-align: center;
    font-size: 0.75rem;
    opacity: 0.4;
    letter-spacing: 0.2em;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="startScreen" class="overlay">
  <h1>NEON METEOR DASH</h1>
  <p>Pilot your ship through the meteor storm.</p>
  <p>Move with <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or <kbd>Arrows</kbd> or <kbd>Mouse</kbd></p>
  <p>Dodge meteors, lasers and energy mines.</p>
  <p>Collect glowing orbs for score.</p>
  <p>You have 3 hearts. Survive.</p>
  <button id="startBtn">START</button>
  <div class="footnote">A SINGLE-FILE CANVAS GAME</div>
</div>

<div id="gameOverScreen" class="overlay hidden">
  <h2>GAME OVER</h2>
  <p class="stat">SCORE: <span class="val" id="finalScore">0</span></p>
  <p class="stat">TIME SURVIVED: <span class="val" id="finalTime">0.0s</span></p>
  <p class="stat high">HIGH SCORE: <span class="val" id="finalHigh">0</span></p>
  <button id="restartBtn">RESTART</button>
</div>

<script>
'use strict';

// =========================================================
// Neon Meteor Dash — single-file canvas game
// =========================================================

const canvas = document.getElementById('game');
const ctx    = canvas.getContext('2d');

let W = 0, H = 0;
function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// ---------- Input ----------
const keys  = {};
const mouse = { x: W / 2, y: H / 2, active: false };

window.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(e.key.toLowerCase())) {
    e.preventDefault();
  }
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
window.addEventListener('mousemove', e => {
  mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true;
});

// ---------- Utilities ----------
const rand    = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const choice  = arr   => arr[Math.floor(Math.random() * arr.length)];
const clamp   = (v, a, b) => Math.max(a, Math.min(b, v));
const dist2   = (a, b) => { const dx = a.x - b.x, dy = a.y - b.y; return dx * dx + dy * dy; };

// ---------- Game State ----------
let state       = 'start';   // 'start' | 'playing' | 'dying' | 'gameover'
let lastT       = 0;
let time        = 0;
let score       = 0;
let hearts      = 3;
let shake       = 0;
let damageFlash = 0;
let highScore   = parseInt(localStorage.getItem('nmd-high') || '0', 10) || 0;

let player, meteors, lasers, mines, orbs, particles, popups, stars, nebulas;
let spawnTimers;

// ---------- Stars + Nebulas ----------
function buildStars() {
  stars = [];
  for (let i = 0; i < 240; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      z: Math.random() * 0.9 + 0.1,
      r: Math.random() * 1.4 + 0.3,
      tw: Math.random() * Math.PI * 2,
      c: choice(['#9be8ff', '#ffffff', '#c9a8ff', '#74e8c9', '#fff7c4'])
    });
  }
}
function buildNebulas() {
  nebulas = [];
  const palette = ['#5a1a8a', '#0b3a8a', '#1f0a5a', '#8a1a6a'];
  for (let i = 0; i < 5; i++) {
    nebulas.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: rand(180, 380),
      c: choice(palette),
      a: rand(0.06, 0.16),
      vx: rand(-8, -2),
    });
  }
}
buildStars();
buildNebulas();

// ---------- Init ----------
function init() {
  player = {
    x: W * 0.22, y: H / 2,
    vx: 0, vy: 0,
    r: 14,
    invuln: 1.4,
    angle: 0,
    targetAngle: 0,
    trailT: 0,
  };
  meteors   = [];
  lasers    = [];
  mines     = [];
  orbs      = [];
  particles = [];
  popups    = [];
  spawnTimers = { meteor: 1.2, laser: 5, mine: 9, orb: 1.0 };
  time = 0;
  score = 0;
  hearts = 3;
  shake = 0;
  damageFlash = 0;
}

// ---------- Particle helpers ----------
function spawnParticles(x, y, opts = {}) {
  const count = opts.count ?? 18;
  const speed = opts.speed ?? 220;
  const life  = opts.life  ?? 0.7;
  const color = opts.color ?? '#00f0ff';
  const size  = opts.size  ?? 3;
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = speed * (0.4 + Math.random() * 0.9);
    particles.push({
      x, y,
      vx: Math.cos(a) * s,
      vy: Math.sin(a) * s,
      life: life * (0.6 + Math.random() * 0.8),
      maxLife: life,
      r: size * (0.7 + Math.random() * 0.8),
      c: color,
      drag: 0.92 + Math.random() * 0.06,
    });
  }
}

function spawnPopup(x, y, text, color = '#5cffb0') {
  popups.push({ x, y, vy: -60, life: 1.0, text, color });
}

// ---------- Spawners ----------
function difficulty() { return 1 + time / 28; }

function makeMeteorShape(r) {
  const pts = [];
  const n = randInt(8, 12);
  for (let i = 0; i < n; i++) {
    const a  = (i / n) * Math.PI * 2;
    const rr = r * rand(0.68, 1.1);
    pts.push({ x: Math.cos(a) * rr, y: Math.sin(a) * rr });
  }
  return pts;
}

function spawnMeteor() {
  const r = rand(18, 46);
  meteors.push({
    x: W + r + 20,
    y: rand(r, H - r),
    vx: -rand(120, 220) * difficulty(),
    vy: rand(-30, 30),
    r,
    rot: Math.random() * Math.PI * 2,
    vr:  rand(-2, 2),
    shape: makeMeteorShape(r),
  });
}

function spawnLaser() {
  const y = rand(50, H - 50);
  lasers.push({
    y,
    warn:   0.9,
    active: 0.32,
    state:  'warn',
    thickness: rand(8, 16),
  });
}

function spawnMine() {
  mines.push({
    x: W + 40,
    y: rand(70, H - 70),
    vx: -rand(60, 110) * Math.sqrt(difficulty()),
    vy: rand(-15, 15),
    r: 14,
    pulse: 0,
    armed: 0.4,
  });
}

function spawnOrb() {
  orbs.push({
    x: W + 30,
    y: rand(40, H - 40),
    vx: -rand(130, 210),
    vy: rand(-30, 30),
    r: 9,
    pulse: Math.random() * Math.PI * 2,
  });
}

// ---------- Damage / Game over ----------
function damagePlayer() {
  hearts -= 1;
  player.invuln = 1.6;
  shake = Math.max(shake, 0.9);
  damageFlash = 1.0;
  if (hearts <= 0) {
    spawnParticles(player.x, player.y, { count: 80, color: '#00f0ff', speed: 620, life: 1.2, size: 4 });
    spawnParticles(player.x, player.y, { count: 50, color: '#ff2bd6', speed: 520, life: 1.0, size: 3 });
    spawnParticles(player.x, player.y, { count: 35, color: '#ffffff', speed: 760, life: 0.9, size: 2 });
    state = 'dying';
    setTimeout(gameOver, 380);
  }
}

function gameOver() {
  if (state !== 'dying') return;
  state = 'gameover';
  if (score > highScore) {
    highScore = score;
    localStorage.setItem('nmd-high', String(highScore));
  }
  document.getElementById('finalScore').textContent = score;
  document.getElementById('finalTime').textContent  = time.toFixed(1) + 's';
  document.getElementById('finalHigh').textContent  = highScore;
  document.getElementById('gameOverScreen').classList.remove('hidden');
}

// ---------- Update ----------
function update(dt) {
  time += dt;
  shake       = Math.max(0, shake - dt * 2);
  damageFlash = Math.max(0, damageFlash - dt * 3);

  // Player input (only if still alive)
  if (state === 'playing') {
    const accel = 1500;
    const friction = 0.86;
    let inputX = 0, inputY = 0;
    if (keys['w'] || keys['arrowup'])    inputY -= 1;
    if (keys['s'] || keys['arrowdown'])  inputY += 1;
    if (keys['a'] || keys['arrowleft'])  inputX -= 1;
    if (keys['d'] || keys['arrowright']) inputX += 1;
    const usingKeys = inputX !== 0 || inputY !== 0;

    if (usingKeys) {
      const len = Math.hypot(inputX, inputY) || 1;
      player.vx += (inputX / len) * accel * dt;
      player.vy += (inputY / len) * accel * dt;
    } else if (mouse.active) {
      const dx = mouse.x - player.x;
      const dy = mouse.y - player.y;
      player.vx += dx * 9 * dt;
      player.vy += dy * 9 * dt;
    }

    const fric = Math.pow(friction, dt * 60);
    player.vx *= fric;
    player.vy *= fric;
    const sp = Math.hypot(player.vx, player.vy);
    const maxSp = 540;
    if (sp > maxSp) { player.vx = player.vx / sp * maxSp; player.vy = player.vy / sp * maxSp; }

    player.x += player.vx * dt;
    player.y += player.vy * dt;
    player.x = clamp(player.x, player.r, W - player.r);
    player.y = clamp(player.y, player.r, H - player.r);

    if (sp > 30) player.targetAngle = Math.atan2(player.vy, player.vx);
    let dA = player.targetAngle - player.angle;
    while (dA >  Math.PI) dA -= Math.PI * 2;
    while (dA < -Math.PI) dA += Math.PI * 2;
    player.angle += dA * Math.min(1, dt * 10);
    player.invuln = Math.max(0, player.invuln - dt);

    // thrust trail
    player.trailT -= dt;
    if (player.trailT <= 0) {
      player.trailT = 0.015;
      const back = player.angle + Math.PI;
      const px = player.x + Math.cos(back) * 12;
      const py = player.y + Math.sin(back) * 12;
      const speedy = sp > 80;
      particles.push({
        x: px, y: py,
        vx: Math.cos(back) * (40 + Math.random() * 70) + player.vx * 0.2,
        vy: Math.sin(back) * (40 + Math.random() * 70) + player.vy * 0.2,
        life: 0.45, maxLife: 0.45,
        r: 2 + Math.random() * 2,
        c: speedy ? '#00f0ff' : '#8fdfff',
        drag: 0.9,
      });
    }
  }

  // Stars & nebulas scroll
  for (const s of stars) {
    s.x  -= (40 + s.z * 90) * dt;
    s.tw += dt * (1 + s.z * 4);
    if (s.x < -2) { s.x = W + 2; s.y = Math.random() * H; }
  }
  for (const n of nebulas) {
    n.x += n.vx * dt;
    if (n.x + n.r < 0) { n.x = W + n.r; n.y = Math.random() * H; }
  }

  // Spawn timers
  spawnTimers.orb -= dt;
  if (spawnTimers.orb <= 0) { spawnOrb(); spawnTimers.orb = rand(0.9, 1.6); }

  spawnTimers.meteor -= dt;
  if (spawnTimers.meteor <= 0) {
    spawnMeteor();
    const base = clamp(1.4 - time * 0.013, 0.32, 1.4);
    spawnTimers.meteor = rand(base, base + 0.35);
  }

  if (time > 8) {
    spawnTimers.laser -= dt;
    if (spawnTimers.laser <= 0) {
      spawnLaser();
      spawnTimers.laser = rand(2.6, 4.4) / (1 + time * 0.012);
    }
  }

  if (time > 18) {
    spawnTimers.mine -= dt;
    if (spawnTimers.mine <= 0) {
      spawnMine();
      spawnTimers.mine = rand(3.2, 5.0) / (1 + time * 0.008);
    }
  }

  // Meteors
  for (const m of meteors) {
    m.x   += m.vx * dt;
    m.y   += m.vy * dt;
    m.rot += m.vr * dt;
    if (m.y < m.r || m.y > H - m.r) m.vy *= -1;
  }
  for (let i = meteors.length - 1; i >= 0; i--) {
    if (meteors[i].x < -80) meteors.splice(i, 1);
  }

  // Meteor vs player
  if (state === 'playing' && player.invuln <= 0) {
    for (const m of meteors) {
      const rsum = m.r * 0.85 + player.r;
      if (dist2(m, player) < rsum * rsum) {
        damagePlayer();
        spawnParticles(player.x, player.y, { count: 32, color: '#ff7a30', speed: 360, life: 0.8 });
        m.vx = Math.abs(m.vx) * 0.6;
        break;
      }
    }
  }

  // Lasers
  for (let i = lasers.length - 1; i >= 0; i--) {
    const l = lasers[i];
    if (l.state === 'warn') {
      l.warn -= dt;
      if (l.warn <= 0) {
        l.state = 'active';
        shake = Math.max(shake, 0.45);
      }
    } else {
      l.active -= dt;
      if (state === 'playing' && player.invuln <= 0) {
        if (Math.abs(player.y - l.y) < l.thickness / 2 + player.r * 0.7) {
          damagePlayer();
          spawnParticles(player.x, player.y, { count: 32, color: '#ff2bd6', speed: 420, life: 0.7 });
        }
      }
      if (Math.random() < 0.8) {
        particles.push({
          x: rand(0, W),
          y: l.y + rand(-l.thickness / 2, l.thickness / 2),
          vx: rand(-80, 80), vy: rand(-40, 40),
          life: 0.3, maxLife: 0.3,
          r: 1.5, c: '#ff2bd6', drag: 0.9,
        });
      }
      if (l.active <= 0) lasers.splice(i, 1);
    }
  }

  // Mines
  for (let i = mines.length - 1; i >= 0; i--) {
    const m = mines[i];
    m.x += m.vx * dt;
    m.y += m.vy * dt;
    m.pulse += dt * 6;
    if (m.armed > 0) m.armed -= dt;
    if (m.y < m.r || m.y > H - m.r) m.vy *= -1;
    if (state === 'playing' && m.armed <= 0 && player.invuln <= 0) {
      const rsum = m.r + player.r;
      if (dist2(m, player) < rsum * rsum) {
        damagePlayer();
        spawnParticles(m.x, m.y, { count: 44, color: '#c64aff', speed: 520, life: 0.9 });
        spawnParticles(m.x, m.y, { count: 24, color: '#ffffff', speed: 400, life: 0.6, size: 2 });
        mines.splice(i, 1);
        shake = Math.max(shake, 0.75);
        continue;
      }
    }
    if (m.x < -60) mines.splice(i, 1);
  }

  // Orbs
  for (let i = orbs.length - 1; i >= 0; i--) {
    const o = orbs[i];
    o.x += o.vx * dt;
    o.y += o.vy * dt;
    o.pulse += dt * 5;
    if (o.y < o.r || o.y > H - o.r) o.vy *= -1;
    if (state === 'playing') {
      const rsum = o.r + player.r + 4; // slight magnet feel
      if (dist2(o, player) < rsum * rsum) {
        score += 10;
        spawnParticles(o.x, o.y, { count: 18, color: '#5cffb0', speed: 280, life: 0.6, size: 2 });
        spawnPopup(o.x, o.y - 12, '+10', '#5cffb0');
        orbs.splice(i, 1);
        continue;
      }
    }
    if (o.x < -30) orbs.splice(i, 1);
  }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    const d = Math.pow(p.drag, dt * 60);
    p.vx *= d; p.vy *= d;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // Popups
  for (let i = popups.length - 1; i >= 0; i--) {
    const p = popups[i];
    p.y += p.vy * dt;
    p.life -= dt;
    if (p.life <= 0) popups.splice(i, 1);
  }
}

// ---------- Render ----------
function render() {
  let sx = 0, sy = 0;
  if (shake > 0) {
    sx = (Math.random() - 0.5) * shake * 26;
    sy = (Math.random() - 0.5) * shake * 26;
  }

  // Background gradient
  const grad = ctx.createRadialGradient(W * 0.65, H * 0.4, 60, W * 0.5, H * 0.5, Math.max(W, H));
  grad.addColorStop(0,   '#0a0530');
  grad.addColorStop(0.5, '#06021a');
  grad.addColorStop(1,   '#01000a');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Nebulas (soft glowing blobs)
  ctx.globalCompositeOperation = 'lighter';
  for (const n of nebulas) {
    const g = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r);
    g.addColorStop(0,   n.c + 'cc');
    g.addColorStop(0.4, n.c + '55');
    g.addColorStop(1,   n.c + '00');
    ctx.globalAlpha = n.a;
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';

  ctx.save();
  ctx.translate(sx, sy);

  // Stars
  for (const s of stars) {
    const t = (Math.sin(s.tw) + 1) * 0.5;
    ctx.globalAlpha = 0.3 + t * 0.7 * s.z;
    ctx.fillStyle = s.c;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r * (0.7 + t * 0.5), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Switch to additive for glows
  ctx.globalCompositeOperation = 'lighter';

  // Orbs
  for (const o of orbs) {
    const pulse = 1 + Math.sin(o.pulse) * 0.18;
    drawGlowCircle(o.x, o.y, o.r * pulse,        '#5cffb0', 30);
    drawGlowCircle(o.x, o.y, o.r * pulse * 0.55, '#ffffff', 16);
  }

  // Mines
  for (const m of mines) {
    const pulse = 1 + Math.sin(m.pulse) * 0.28;
    ctx.strokeStyle = '#c64aff';
    ctx.lineWidth = 2;
    ctx.shadowBlur = 22;
    ctx.shadowColor = '#c64aff';
    ctx.beginPath();
    ctx.arc(m.x, m.y, m.r * pulse, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 0.4;
    ctx.beginPath();
    ctx.arc(m.x, m.y, m.r * pulse * 1.6, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
    drawGlowCircle(m.x, m.y, 3, '#ffffff', 12);
    ctx.shadowBlur = 0;
  }

  // Lasers
  for (const l of lasers) {
    if (l.state === 'warn') {
      const blink = Math.sin(l.warn * 32) > 0 ? 0.75 : 0.2;
      ctx.globalAlpha = blink;
      ctx.fillStyle = '#ff2bd6';
      ctx.shadowBlur = 14;
      ctx.shadowColor = '#ff2bd6';
      ctx.fillRect(0, l.y - 1, W, 2);
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;
    } else {
      const th = l.thickness;
      const lg = ctx.createLinearGradient(0, l.y - th, 0, l.y + th);
      lg.addColorStop(0,   'rgba(255,43,214,0)');
      lg.addColorStop(0.5, '#ff2bd6');
      lg.addColorStop(1,   'rgba(255,43,214,0)');
      ctx.fillStyle = lg;
      ctx.fillRect(0, l.y - th, W, th * 2);
      ctx.fillStyle = '#ffffff';
      ctx.shadowBlur = 30;
      ctx.shadowColor = '#ff2bd6';
      ctx.fillRect(0, l.y - 1.5, W, 3);
      ctx.shadowBlur = 0;
    }
  }

  // Meteors
  ctx.globalCompositeOperation = 'source-over';
  for (const m of meteors) {
    ctx.save();
    ctx.translate(m.x, m.y);
    ctx.rotate(m.rot);
    ctx.shadowColor = '#ff5a25';
    ctx.shadowBlur = 26;
    ctx.fillStyle = '#3a0f08';
    ctx.beginPath();
    for (let i = 0; i < m.shape.length; i++) {
      const p = m.shape[i];
      if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
    }
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#ff7a30';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.globalAlpha = 0.55;
    ctx.strokeStyle = '#ffd2a8';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  // Particles (additive)
  ctx.globalCompositeOperation = 'lighter';
  for (const p of particles) {
    const a = clamp(p.life / p.maxLife, 0, 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = p.c;
    ctx.shadowBlur = 14;
    ctx.shadowColor = p.c;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * (0.5 + a * 0.7), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.shadowBlur  = 0;

  // Player (clean source-over for distinct hull)
  ctx.globalCompositeOperation = 'source-over';
  if ((state === 'playing' || state === 'dying') && hearts > 0) {
    drawPlayer();
  }

  // Popups
  ctx.textAlign = 'center';
  for (const p of popups) {
    ctx.globalAlpha = clamp(p.life, 0, 1);
    ctx.font = 'bold 18px Trebuchet MS, Segoe UI, sans-serif';
    ctx.fillStyle = p.color;
    ctx.shadowBlur = 12;
    ctx.shadowColor = p.color;
    ctx.fillText(p.text, p.x, p.y);
  }
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;

  ctx.restore();

  // Damage flash (no shake offset)
  if (damageFlash > 0) {
    ctx.fillStyle = `rgba(255, 50, 80, ${damageFlash * 0.32})`;
    ctx.fillRect(0, 0, W, H);
  }

  // Vignette
  const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  // HUD (only during play)
  if (state === 'playing' || state === 'dying') drawHUD();
}

function drawGlowCircle(x, y, r, color, blur) {
  ctx.fillStyle = color;
  ctx.shadowBlur = blur;
  ctx.shadowColor = color;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
}

function drawPlayer() {
  ctx.save();
  ctx.translate(player.x, player.y);
  ctx.rotate(player.angle);

  if (player.invuln > 0 && Math.floor(player.invuln * 22) % 2 === 0) {
    ctx.globalAlpha = 0.35;
  }

  ctx.shadowColor = '#00f0ff';
  ctx.shadowBlur = 26;

  // Hull
  ctx.fillStyle   = '#0a3a5a';
  ctx.strokeStyle = '#00f0ff';
  ctx.lineWidth   = 2;
  ctx.beginPath();
  ctx.moveTo(18, 0);
  ctx.lineTo(-12, 10);
  ctx.lineTo(-7,  0);
  ctx.lineTo(-12, -10);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // Inner highlight
  ctx.globalAlpha = (ctx.globalAlpha === 0.35) ? 0.2 : 0.5;
  ctx.fillStyle = '#00f0ff';
  ctx.beginPath();
  ctx.moveTo(12, 0);
  ctx.lineTo(-4, 4);
  ctx.lineTo(-4, -4);
  ctx.closePath();
  ctx.fill();
  ctx.globalAlpha = 1;

  // Cockpit
  ctx.fillStyle = '#ffffff';
  ctx.shadowBlur = 16;
  ctx.beginPath();
  ctx.arc(4, 0, 2.5, 0, Math.PI * 2);
  ctx.fill();

  ctx.shadowBlur = 0;
  ctx.restore();
}

function drawHUD() {
  // Score (left)
  ctx.font = 'bold 22px Trebuchet MS, Segoe UI, sans-serif';
  ctx.textAlign = 'left';
  ctx.shadowColor = '#00f0ff';
  ctx.shadowBlur = 14;
  ctx.fillStyle = '#aef6ff';
  ctx.fillText('SCORE  ' + score, 24, 36);

  // Time (center)
  ctx.textAlign = 'center';
  ctx.fillStyle = '#5cffb0';
  ctx.shadowColor = '#5cffb0';
  ctx.fillText(time.toFixed(1) + 's', W / 2, 36);

  // High score (right)
  ctx.textAlign = 'right';
  ctx.fillStyle = '#ff2bd6';
  ctx.shadowColor = '#ff2bd6';
  ctx.fillText('HIGH  ' + Math.max(highScore, score), W - 24, 36);
  ctx.shadowBlur = 0;

  // Hearts under score
  for (let i = 0; i < 3; i++) {
    drawHeart(34 + i * 30, 70, 11, i < hearts);
  }
}

function drawHeart(x, y, s, filled) {
  ctx.save();
  ctx.translate(x, y);
  ctx.shadowColor = '#ff2bd6';
  ctx.shadowBlur = filled ? 18 : 4;
  ctx.beginPath();
  ctx.moveTo(0, s * 0.4);
  ctx.bezierCurveTo(0, -s * 0.2, -s,   -s * 0.2, -s,   s * 0.2);
  ctx.bezierCurveTo(-s, s * 0.6,    -s * 0.3, s * 0.9,  0,   s * 1.1);
  ctx.bezierCurveTo(s * 0.3, s * 0.9,  s, s * 0.6,    s,   s * 0.2);
  ctx.bezierCurveTo(s, -s * 0.2,     0, -s * 0.2,    0,   s * 0.4);
  ctx.closePath();
  if (filled) {
    ctx.fillStyle = '#ff2bd6';
    ctx.fill();
    ctx.strokeStyle = '#ffd1f4';
    ctx.lineWidth = 1.2;
    ctx.stroke();
  } else {
    ctx.strokeStyle = '#5a1a45';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }
  ctx.shadowBlur = 0;
  ctx.restore();
}

// ---------- Main Loop ----------
function loop(t) {
  const dt = Math.min(0.05, (t - lastT) / 1000 || 0);
  lastT = t;

  if (state === 'playing' || state === 'dying') {
    update(dt);
  } else {
    // Ambient idle motion for menus
    for (const s of stars) {
      s.x  -= (40 + s.z * 90) * dt * 0.45;
      s.tw += dt * (1 + s.z * 4);
      if (s.x < -2) { s.x = W + 2; s.y = Math.random() * H; }
    }
    for (const n of nebulas) {
      n.x += n.vx * dt * 0.5;
      if (n.x + n.r < 0) { n.x = W + n.r; n.y = Math.random() * H; }
    }
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      const d = Math.pow(p.drag, dt * 60);
      p.vx *= d; p.vy *= d;
      p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  render();
  requestAnimationFrame(loop);
}

// ---------- UI wiring ----------
document.getElementById('startBtn').addEventListener('click', () => {
  init();
  document.getElementById('startScreen').classList.add('hidden');
  state = 'playing';
});
document.getElementById('restartBtn').addEventListener('click', () => {
  init();
  document.getElementById('gameOverScreen').classList.add('hidden');
  state = 'playing';
});

// Initial idle state so menus have animated background
init();
state = 'start';
requestAnimationFrame(loop);
</script>
</body>
